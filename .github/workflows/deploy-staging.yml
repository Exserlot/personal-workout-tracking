name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_APP_ENV: staging
      VITE_APP_VERSION: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx --no-install supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" --password "$SUPABASE_DB_PASSWORD"
      - run: npx --no-install supabase migration list --linked
      - run: npx --no-install supabase db push --linked
      - run: npx --no-install vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --no-install vercel build --token="${{ secrets.VERCEL_TOKEN }}"
      - id: deploy
        run: echo "url=$(npx --no-install vercel deploy --prebuilt --token='${{ secrets.VERCEL_TOKEN }}')" >> "$GITHUB_OUTPUT"
      - name: Smoke staging shell
        run: |
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/login" | grep 'id="root"'
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/history/deep-link-check" | grep 'id="root"'
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/manifest.webmanifest" | grep 'FORM'
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/sw.js" | grep 'precacheAndRoute'
