name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 0.2.0
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    uses: ./.github/workflows/quality.yml

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_APP_ENV: production
      VITE_APP_VERSION: ${{ inputs.release_version }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && pnpm check:bundle
      - run: pnpm exec supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" --password "$SUPABASE_DB_PASSWORD"
      - run: pnpm exec supabase migration list --linked
      - run: pnpm exec supabase db push --linked
      - run: pnpm exec vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: pnpm exec vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - id: deploy
        run: echo "url=$(pnpm exec vercel deploy --prebuilt --prod --token='${{ secrets.VERCEL_TOKEN }}')" >> "$GITHUB_OUTPUT"
      - name: Smoke production shell
        run: |
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/login" | grep 'id="root"'
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/today" | grep 'id="root"'
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/manifest.webmanifest" | grep 'FORM'
          curl --fail --retry 5 "${{ steps.deploy.outputs.url }}/sw.js" | grep 'precacheAndRoute'
