name: Quality Gate

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npx --no-install supabase start
      - run: npx --no-install supabase db reset
      - run: npx --no-install supabase db lint --local
      - run: npx --no-install supabase db advisors --local --type all --level warn --fail-on warn
      - run: npx --no-install supabase test db
      - run: npm run quality
      - run: npm run test:e2e
      - run: npm run test:pwa
